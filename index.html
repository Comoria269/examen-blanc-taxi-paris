<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Examen blanc — Taxi parisien — Test aléatoire</title>
<style>
body{font-family:Arial,sans-serif;max-width:840px;margin:auto;padding:16px;background:#f4f6f8;color:#122}
h1{color:#0b3d62}h2{margin-top:28px;color:#0b3d62}.q{background:#fff;padding:14px;border-radius:10px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}label{display:block;margin:6px 0}button{background:#0b3d62;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-size:16px;cursor:pointer;margin-right:8px}#result{font-size:20px;font-weight:bold;margin-top:16px;padding:12px;border-radius:8px;background:#dff3e1}.ok{color:#0a7d33;font-weight:bold}.bad{color:#b3261e;font-weight:bold}.exp{margin-top:8px;padding:10px;background:#eef6ff;border-left:4px solid #0b3d62;border-radius:6px}input[type=text],select{width:100%;padding:8px;margin-top:6px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box}.tag{display:inline-block;background:#0b3d62;color:#fff;padding:2px 8px;border-radius:12px;font-size:12px;margin-bottom:6px}.diag{background:#fff;border-left:5px solid #b3261e;padding:12px;border-radius:8px;margin-top:12px}.diag.good{border-left-color:#0a7d33}.diag.warn{border-left-color:#d97706}
</style>
</head>
<body>
<h1>Examen blanc — Taxi parisien</h1>
<p>À chaque clic sur <strong>« Générer un nouvel examen »</strong>, 24 questions sont tirées au hasard dans une banque de 60 questions. Les questions et les réponses sont mélangées.</p>
<button onclick="generer()">Générer un nouvel examen</button>
<button onclick="corriger()">Corriger mon examen</button>
<button onclick="location.reload()">Recommencer</button>
<div id="result"></div>
<div id="diagnostic"></div>
<div id="quiz"></div>
<div id="details"></div>

<script>
const banque=[
{t:'QCM',q:'Que signifie un lumineux rouge sur un taxi parisien ?',o:['Le taxi est libre','Le taxi est occupé ou indisponible','Le taxi est en fin de service'],r:1,e:'Le rouge indique que le taxi est occupé ou indisponible.',theme:'reglementation'},
{t:'QCM',q:'Que signifie un lumineux vert sur un taxi parisien ?',o:['Le taxi est libre','Le taxi est occupé','Le taxi est en panne'],r:0,e:'Le vert indique que le taxi est libre.',theme:'reglementation'},
{t:'QCM',q:'Le terminal de paiement par carte bancaire est :',o:['Facultatif','Obligatoire','Réservé aux longues courses'],r:1,e:'Le terminal de paiement par carte est obligatoire.',theme:'reglementation'},
{t:'QCM',q:'À Paris, l’ADS de taxi est principalement délivrée par :',o:['La préfecture de police','La SNCF','La chambre de commerce'],r:0,e:'La préfecture de police délivre l’ADS à Paris.',theme:'reglementation'},
{t:'QCM',q:'Le taximètre doit être :',o:['Masqué','Visible et fonctionnel','Utilisé seulement la nuit'],r:1,e:'Le taximètre doit être visible et fonctionnel.',theme:'reglementation'},
{t:'QCM',q:'Un chien guide ou animal d’assistance doit être :',o:['Refusé','Accepté à bord','Accepté avec supplément'],r:1,e:'Les animaux d’assistance doivent être acceptés.',theme:'reglementation'},
{t:'QCM',q:'Le chauffeur peut refuser une course notamment lorsque :',o:['Le client veut aller à Montmartre','Sa sécurité est compromise','La course est trop courte'],r:1,e:'La sécurité justifie un refus de course.',theme:'reglementation'},
{t:'QCM',q:'La prise en charge est :',o:['Un pourboire','Un montant forfaitaire au début de la course','Le prix du kilomètre'],r:1,e:'La prise en charge est un forfait ajouté au début de la course.',theme:'reglementation'},
{t:'QCM',q:'Le tarif C à Paris concerne principalement :',o:['Les aéroports','Les courses de nuit','Les bagages'],r:0,e:'Le tarif C est un forfait aéroport.',theme:'reglementation'},
{t:'QCM',q:'Que signifie ADS ?',o:['Autorisation de stationnement','Assurance dommages','Arrêt de service'],r:0,e:'ADS signifie Autorisation de Stationnement.',theme:'reglementation'},
{t:'QCM',q:'Où se trouve la gare de Lyon ?',o:['10e arrondissement','12e arrondissement','16e arrondissement'],r:1,e:'La gare de Lyon est dans le 12e arrondissement.',theme:'territoire'},
{t:'QCM',q:'Où se trouve la gare du Nord ?',o:['10e arrondissement','13e arrondissement','16e arrondissement'],r:0,e:'La gare du Nord est dans le 10e arrondissement.',theme:'territoire'},
{t:'QCM',q:'Où se trouve la gare Montparnasse ?',o:['1er arrondissement','14e arrondissement','18e arrondissement'],r:1,e:'La gare Montparnasse est dans le 14e arrondissement.',theme:'territoire'},
{t:'QCM',q:'Où se trouve Roissy-Charles-de-Gaulle ?',o:['Nord-est de Paris','Sud de Paris','Ouest de Paris'],r:0,e:'Roissy est au nord-est de Paris.',theme:'territoire'},
{t:'QCM',q:'Où se trouve Paris-Orly ?',o:['Nord de Paris','Sud de Paris','Dans Paris'],r:1,e:'Orly est au sud de Paris.',theme:'territoire'},
{t:'QCM',q:'Où se trouve la Pitié-Salpêtrière ?',o:['13e arrondissement','8e arrondissement','17e arrondissement'],r:0,e:'La Pitié-Salpêtrière est dans le 13e arrondissement.',theme:'territoire'},
{t:'QCM',q:'Où se trouve l’hôpital Européen Georges-Pompidou ?',o:['15e arrondissement','4e arrondissement','19e arrondissement'],r:0,e:'L’hôpital Européen Georges-Pompidou est dans le 15e arrondissement.',theme:'territoire'},
{t:'QCM',q:'Quel lieu n’est pas une gare parisienne ?',o:['Gare du Nord','Gare de l’Est','Place de la République'],r:2,e:'La place de la République n’est pas une gare.',theme:'territoire'},
{t:'QCM',q:'Le Sacré-Cœur se trouve dans le :',o:['13e arrondissement','15e arrondissement','18e arrondissement'],r:2,e:'Le Sacré-Cœur est dans le 18e arrondissement.',theme:'territoire'},
{t:'QCM',q:'Le périphérique sert notamment à :',o:['Faire le tour de Paris','Traverser uniquement le 1er arrondissement','Accéder seulement aux aéroports'],r:0,e:'Le périphérique entoure Paris.',theme:'territoire'},
{t:'Vrai / Faux',q:'Un taxi peut circuler sur une voie de bus comme un véhicule de transport en commun.',o:['Vrai','Faux'],r:1,e:'Un taxi n’est pas assimilé à un transport en commun sur les voies de bus.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Le lumineux vert signifie que le taxi est libre.',o:['Vrai','Faux'],r:0,e:'Le vert signifie taxi libre.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Le lumineux rouge signifie que le taxi est occupé.',o:['Vrai','Faux'],r:0,e:'Le rouge signifie taxi occupé ou indisponible.',theme:'reglementation'},
{t:'Vrai / Faux',q:'La prise en charge est ajoutée au début de la course.',o:['Vrai','Faux'],r:0,e:'La prise en charge est un forfait initial.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Le tarif C concerne les aéroports parisiens.',o:['Vrai','Faux'],r:0,e:'Le tarif C est un forfait aéroport.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Le taximètre peut rester masqué pendant la course.',o:['Vrai','Faux'],r:1,e:'Le taximètre doit rester visible.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Un animal d’assistance peut être refusé.',o:['Vrai','Faux'],r:1,e:'Les animaux d’assistance doivent être acceptés.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Le chauffeur peut refuser une course si sa sécurité est menacée.',o:['Vrai','Faux'],r:0,e:'La sécurité justifie un refus.',theme:'reglementation'},
{t:'Vrai / Faux',q:'Le périphérique permet de faire le tour de Paris.',o:['Vrai','Faux'],r:0,e:'Le périphérique entoure Paris.',theme:'territoire'},
{t:'Vrai / Faux',q:'Roissy est situé au sud de Paris.',o:['Vrai','Faux'],r:1,e:'Roissy est au nord-est de Paris.',theme:'territoire'},
{t:'Association',q:'Associez la gare du Nord à son arrondissement.',o:['10e arrondissement','12e arrondissement','14e arrondissement'],r:0,e:'La gare du Nord est dans le 10e arrondissement.',theme:'territoire'},
{t:'Association',q:'Associez la gare de Lyon à son arrondissement.',o:['10e arrondissement','12e arrondissement','14e arrondissement'],r:1,e:'La gare de Lyon est dans le 12e arrondissement.',theme:'territoire'},
{t:'Association',q:'Associez la gare Montparnasse à son arrondissement.',o:['10e arrondissement','12e arrondissement','14e arrondissement'],r:2,e:'La gare Montparnasse est dans le 14e arrondissement.',theme:'territoire'},
{t:'Association',q:'Associez le lumineux vert à sa signification.',o:['Taxi libre','Taxi occupé','Autorisation de taxi'],r:0,e:'Le vert signifie taxi libre.',theme:'reglementation'},
{t:'Association',q:'Associez le lumineux rouge à sa signification.',o:['Taxi libre','Taxi occupé','Autorisation de taxi'],r:1,e:'Le rouge signifie taxi occupé.',theme:'reglementation'},
{t:'Association',q:'Associez l’ADS à sa signification.',o:['Taxi libre','Taxi occupé','Autorisation de taxi'],r:2,e:'ADS signifie Autorisation de Stationnement.',theme:'reglementation'},
{t:'Réponse courte',q:'Quelle autorité délivre principalement l’ADS de taxi à Paris ?',r:'prefecture',e:'La préfecture de police délivre l’ADS à Paris.',theme:'reglementation'},
{t:'Réponse courte',q:'Quelle grande gare parisienne se trouve dans le 10e arrondissement ?',r:'nord',e:'La gare du Nord est dans le 10e arrondissement.',theme:'territoire'},
{t:'Réponse courte',q:'Comment appelle-t-on l’autorisation nécessaire pour exercer comme taxi à Paris ?',r:'ads',e:'ADS signifie Autorisation de Stationnement.',theme:'reglementation'},
{t:'Réponse courte',q:'Quel aéroport parisien se trouve au nord-est de Paris ?',r:'roissy',e:'Roissy-Charles-de-Gaulle est au nord-est de Paris.',theme:'territoire'},
{t:'Réponse courte',q:'Quel aéroport parisien se trouve au sud de Paris ?',r:'orly',e:'Orly est au sud de Paris.',theme:'territoire'},
{t:'Calcul',q:'La prise en charge est de 3 € et la course indique 12 €. Quel est le total ?',r:15,e:'3 € + 12 € = 15 €.',theme:'calcul'},
{t:'Calcul',q:'Un client paie 20 € et doit recevoir 5 € de monnaie. Quel est le montant de la course ?',r:15,e:'20 € - 5 € = 15 €.',theme:'calcul'},
{t:'Calcul',q:'La prise en charge est de 4 € et la course indique 16 €. Quel est le total ?',r:20,e:'4 € + 16 € = 20 €.',theme:'calcul'},
{t:'Calcul',q:'Un client paie 30 € et doit recevoir 6 € de monnaie. Quel est le montant de la course ?',r:24,e:'30 € - 6 € = 24 €.',theme:'calcul'},
{t:'Calcul',q:'La prise en charge est de 2 € et la course indique 18 €. Quel est le total ?',r:20,e:'2 € + 18 € = 20 €.',theme:'calcul'},
{t:'Calcul',q:'Un client paie 50 € et doit recevoir 10 € de monnaie. Quel est le montant de la course ?',r:40,e:'50 € - 10 € = 40 €.',theme:'calcul'},
{t:'Mise en situation',q:'Un client agressif menace le chauffeur. Quelle est la meilleure attitude ?',o:['Continuer malgré le danger','Mettre fin à la course si nécessaire et privilégier la sécurité','Accepter pour éviter un conflit'],r:1,e:'La sécurité prime en cas de menace.',theme:'reglementation'},
{t:'Mise en situation',q:'Un client souhaite aller à Roissy. Dans quelle direction se trouve l’aéroport ?',o:['Nord-est de Paris','Sud de Paris','Ouest de Paris'],r:0,e:'Roissy est au nord-est de Paris.',theme:'territoire'},
{t:'Mise en situation',q:'Un client souhaite aller à Orly. Dans quelle direction se trouve l’aéroport ?',o:['Nord de Paris','Sud de Paris','Ouest de Paris'],r:1,e:'Orly est au sud de Paris.',theme:'territoire'},
{t:'Mise en situation',q:'Un client demande une course vers Montmartre. Dans quel arrondissement se trouve le Sacré-Cœur ?',o:['13e arrondissement','15e arrondissement','18e arrondissement'],r:2,e:'Le Sacré-Cœur est dans le 18e arrondissement.',theme:'territoire'},
{t:'Mise en situation',q:'Un client veut aller à la gare de Lyon. Dans quel arrondissement se trouve-t-elle ?',o:['10e arrondissement','12e arrondissement','16e arrondissement'],r:1,e:'La gare de Lyon est dans le 12e arrondissement.',theme:'territoire'},
{t:'Mise en situation',q:'Un client veut aller à la gare du Nord. Dans quel arrondissement se trouve-t-elle ?',o:['10e arrondissement','13e arrondissement','16e arrondissement'],r:0,e:'La gare du Nord est dans le 10e arrondissement.',theme:'territoire'},
{t:'Logique',q:'Quel élément n’est pas obligatoire dans un taxi parisien ?',o:['Taximètre','Terminal bancaire','Télévision personnelle'],r:2,e:'La télévision personnelle n’est pas un équipement réglementaire obligatoire.',theme:'reglementation'},
{t:'Logique',q:'Quel élément permet de calculer le prix de la course ?',o:['Taximètre','Radio','Antenne'],r:0,e:'Le taximètre calcule le prix de la course.',theme:'reglementation'},
{t:'Logique',q:'Quel élément indique qu’un taxi est libre ?',o:['Lumineux vert','Lumineux rouge','Panneau publicitaire'],r:0,e:'Le vert indique que le taxi est libre.',theme:'reglementation'},
{t:'Logique',q:'Quel élément indique qu’un taxi est occupé ?',o:['Lumineux vert','Lumineux rouge','Panneau publicitaire'],r:1,e:'Le rouge indique que le taxi est occupé.',theme:'reglementation'},
{t:'Logique',q:'Quel lieu est un aéroport parisien ?',o:['Roissy-Charles-de-Gaulle','Gare du Nord','Place de la Nation'],r:0,e:'Roissy est un aéroport parisien.',theme:'territoire'},
{t:'Logique',q:'Quel lieu est une gare parisienne ?',o:['Gare de Lyon','Tour Eiffel','Arc de Triomphe'],r:0,e:'La gare de Lyon est une gare parisienne.',theme:'territoire'},
{t:'Logique',q:'Quel lieu est un hôpital parisien ?',o:['Pitié-Salpêtrière','Gare du Nord','Place de la Concorde'],r:0,e:'La Pitié-Salpêtrière est un hôpital parisien.',theme:'territoire'}
];
let examen=[];
function shuffle(a){return a.sort(()=>Math.random()-0.5);}
function generer(){const copie=[...banque];shuffle(copie);examen=copie.slice(0,24);let html='';examen.forEach((q,i)=>{html+='<div class="q"><span class="tag">'+q.t+'</span><strong>Question '+(i+1)+'.</strong> '+q.q+'<br>';
if(q.t==='Réponse courte'){html+='<input type="text" id="rep'+i+'" placeholder="Votre réponse">';}
else if(q.t==='Calcul'){html+='<input type="text" id="rep'+i+'" placeholder="Votre réponse en euros">';}
else{const opts=[...q.o];const correct=q.o[q.r];shuffle(opts);q.choix=opts;q.bonne=opts.indexOf(correct);opts.forEach((o,j)=>{html+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>';});}
html+='</div>';});document.getElementById('quiz').innerHTML=html;document.getElementById('result').textContent='';document.getElementById('diagnostic').innerHTML='';document.getElementById('details').innerHTML='';}
function corriger(){if(!examen.length){alert('Cliquez d’abord sur « Générer un nouvel examen ».');return;}let s=0;let html='';const themes={reglementation:[],territoire:[],calcul:[]};examen.forEach((q,i)=>{let ok=false;if(q.t==='Réponse courte'||q.t==='Calcul'){const v=(document.getElementById('rep'+i).value||'').toLowerCase().replace(',','.');if(q.t==='Calcul'){ok=parseFloat(v)===q.r;}else{ok=v.includes(q.r);}if(ok)s++;}else{const e=document.querySelector('input[name=q'+i+']:checked');ok=e&&parseInt(e.value)===q.bonne;if(ok)s++;}
themes[q.theme].push({i:i+1,ok:ok});html+='<div class="q"><strong>Question '+(i+1)+' :</strong> <span class="'+(ok?'ok':'bad')+'">'+(ok?'Juste':'Faux ou non répondue')+'</span><div class="exp"><strong>Bonne réponse :</strong> '+(q.t==='Réponse courte'||q.t==='Calcul'?q.r:q.o[q.r])+'<br><strong>Pourquoi :</strong> '+q.e+'</div></div>';});
const res=document.getElementById('result');res.textContent='Score : '+s+' / 24';res.style.background=s>=17?'#dff3e1':s>=12?'#fff3cd':'#f8d7da';
let diag='<h2>Bilan personnalisé</h2>';const conseils={reglementation:'Révise les lumineux, l’ADS, le taximètre, les tarifs, la prise en charge, le paiement et la sécurité.',territoire:'Révise les gares, arrondissements, aéroports, hôpitaux, monuments et le périphérique.',calcul:'Entraîne-toi aux additions, soustractions et calculs de monnaie.'};
Object.keys(themes).forEach(t=>{const qs=themes[t];if(!qs.length)return;const bonnes=qs.filter(x=>x.ok).length;const pct=Math.round(bonnes/qs.length*100);let cls='diag good';let message='Très bien, ce thème semble maîtrisé.';if(pct<60){cls='diag';message='Priorité absolue : '+conseils[t];}else if(pct<85){cls='diag warn';message='À consolider : '+conseils[t];}
const erreurs=qs.filter(x=>!x.ok).map(x=>x.i);diag+='<div class="'+cls+'"><strong>'+t.charAt(0).toUpperCase()+t.slice(1)+' :</strong> '+bonnes+'/'+qs.length+' ('+pct+'%)<br>'+message;if(erreurs.length){diag+='<br><strong>Questions à refaire :</strong> '+erreurs.join(', ')+'.';}diag+='</div>';});
document.getElementById('diagnostic').innerHTML=diag;document.getElementById('details').innerHTML='<h2>Correction et explications</h2>'+html;}
window.onload=generer;
</script>
</body>
</html>
